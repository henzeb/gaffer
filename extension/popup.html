<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gaffer</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; width: 280px; font: 13px system-ui, sans-serif; background: #111; color: #eee; }
  main { padding: 14px 16px 16px; display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  .site { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .host { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .via, .note, .muted { color: #9ca3af; font-size: 12px; }
  .via { margin-top: -8px; }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .check input { margin: 0; accent-color: #14b8a6; }
  .check input:disabled + span { opacity: .4; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 11px; background: #3f3f46; transition: background .15s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #eee; transition: transform .15s; }
  .switch input:checked + span { background: #14b8a6; }
  .switch input:checked + span::after { transform: translateX(16px); background: #0f172a; }
  .switch input:disabled + span { opacity: .4; }
  button { font: inherit; padding: 7px 12px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
  button.secondary { background: #27272a; color: #eee; }
  button:disabled { opacity: .4; cursor: default; }
  .versions { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .status { color: #9ca3af; }
  .status.error { color: #f87171; }
  .status.good { color: #4ade80; }
  a { color: #2dd4bf; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1><img src="icons/icon-32.png" alt=""><span id="title"></span></h1>
  <section id="noscripts" hidden>
    <p class="note" data-i18n="popup.noScripts"></p>
    <button id="open-settings" class="secondary" data-i18n="popup.openSettings"></button>
  </section>
  <div class="site">
    <span class="host" id="host">…</span>
    <label class="switch" data-i18n-title="popup.toggle"><input type="checkbox" id="toggle" disabled><span></span></label>
  </div>
  <div class="via" id="via" hidden></div>
  <div class="note" id="unavailable" data-i18n="popup.unavailable" hidden></div>
  <div class="note" id="lost" data-i18n="popup.permission.lost" hidden></div>
  <label class="check"><input type="checkbox" id="default" disabled><span data-i18n="popup.default"></span></label>
  <div><button id="inspect" data-i18n="popup.inspect" disabled></button></div>
  <div class="versions" id="versions" hidden>
    <span data-i18n="popup.version"></span><span id="version"></span>
  </div>
  <div class="versions" id="dev" hidden>
    <span data-i18n="popup.devVersion"></span><span id="built"></span>
  </div>
  <div class="row"><button id="update" class="secondary" data-i18n="popup.update" hidden></button><span class="status" id="status"></span></div>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
